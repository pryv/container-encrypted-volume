name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # Conformance runs natively on both published architectures, so the
  # backends are proven on arm64 too, not only built for it.
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Static checks (syntax + manifests + hygiene)
        run: |
          set -e
          for f in cev.sh entrypoint-wrapper.sh backends/*/backend.sh key-providers/*/provider.sh test/*.sh; do
            bash -n "$f"; echo "ok: $f"
          done
          ./test/validate-manifests.sh
      - name: LUKS conformance (privileged)
        run: |
          sudo modprobe dm_crypt
          docker run --rm --privileged -v "$PWD:/cev" -w /cev node:24-bookworm bash -c '
            apt-get update -qq && apt-get install -y -qq cryptsetup e2fsprogs openssl >/dev/null
            chmod +x cev.sh backends/*/backend.sh key-providers/*/provider.sh test/*.sh
            ./test/conformance.sh luks'
      # Skipped only when the runner has no FUSE device; any other failure
      # (install, mount, conformance) fails the job.
      - name: gocryptfs conformance (FUSE)
        run: |
          if [ ! -e /dev/fuse ]; then echo "::warning::gocryptfs conformance skipped: no /dev/fuse on this runner"; exit 0; fi
          docker run --rm --cap-add SYS_ADMIN --device /dev/fuse --security-opt apparmor=unconfined \
            -v "$PWD:/cev" -w /cev node:24-bookworm bash -c '
            apt-get update -qq && apt-get install -y -qq gocryptfs fuse openssl >/dev/null
            chmod +x cev.sh backends/*/backend.sh key-providers/*/provider.sh test/*.sh
            ./test/conformance.sh gocryptfs'

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The payload is shell scripts only; QEMU just runs the Dockerfile's
      # chmod step for the arm64 variant.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: pryvio/container-encrypted-volume
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
